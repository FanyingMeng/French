# 自动生成发音 mp3（免费：公开仓库的 GitHub Actions 不收费，edge-tts 不需要账号）
# - 改了 words/verbs/sentences.json 推送后自动运行，只生成新增的
# - 也可以在 GitHub 网页的 Actions 页面手动点 "Run workflow"（换声音、失败重跑时用）
name: Generate audio

on:
  push:
    branches: [main]
    paths:
      - words.json
      - verbs.json
      - sentences.json
      - tools/gen_audio.py
      - .github/workflows/tts.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate missing audio
        # 句子优先生成；每次最多跑 40 分钟，没生成完的再手动跑一次即可
        run: |
          python tools/gen_audio.py --only sentence
          python tools/gen_audio.py --time-limit 2400

      - name: Commit audio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "没有新音频"
          else
            git commit -m "Generate audio"
            git pull --rebase origin main
            git push
          fi
